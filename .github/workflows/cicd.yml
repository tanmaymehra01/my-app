name: CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }} \
            ./frontend

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }}

      - name: Tag backend latest
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/my-app-backend:latest

      - name: Tag frontend latest
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:latest

      - name: Push latest images
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/my-app-backend:latest

          docker push \
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:latest
